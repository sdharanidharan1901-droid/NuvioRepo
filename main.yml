name: Build ToonHub Provider

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build ToonHub
        run: node build.js toonhub

      - name: Commit generated provider
        run: |
          if ! git diff --quiet -- src/providers/toonhub.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/providers/toonhub.js
            git commit -m "Build updated ToonHub provider"
            git push
          else
            echo "No changes generated."
          fi
